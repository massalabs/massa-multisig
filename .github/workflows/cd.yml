name: multisig CD

on:
  release:
    types: [published]

jobs:
  test:
    uses: ./.github/workflows/ci-tests.yml

  publish-latest:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 18
          registry-url: https://registry.npmjs.org

      - name: publish
        run: |
          npm ci
          npm run build
          npm run publish:latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_token }}
