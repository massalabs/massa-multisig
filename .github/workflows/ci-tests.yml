name: multisig CI
on:
  pull_request:
  workflow_call:
  push:
    branches:
      - main
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Code quality
        run: npm run fmt:check

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test
